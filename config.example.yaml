languages:
  source: "English"
  target: "YOUR_TARGET_LANGUAGE"

files:
  # Paths are resolved relative to this configuration file.
  input: "data/input.example.jsonl"
  examples: "data/examples.example.jsonl"
  glossary: "data/glossary.example.jsonl"
  style_instruction: "prompts/style.example.txt"
  output: "output/translations.jsonl"

provider:
  # Use "openai" or "anthropic". The key is read from the named environment variable.
  name: "anthropic"
  model: "claude-fable-5-1"
  api_key_env: "ANTHROPIC_API_KEY"

retrieval:
  # Validated default: BM25 only. No semantic model or GPU is used.
  # Other available methods are: semantic, hybrid, none.
  method: "bm25"
  bm25_samples: 16
  semantic_samples: 0
  bm25_k1: 1.5
  bm25_b: 0.75
  ordering: "most_similar_last"
  max_glossary_senses: 15
  # The best validated run did not add a second set of examples per phrase.
  # Increase this only after validation; large values can add substantial noise.
  glossary_examples_per_phrase: 0
  semantic_model: "intfloat/multilingual-e5-base"
  # "cuda" is recommended. "cpu" works but can be much slower.
  semantic_device: "cuda"

processing:
  # Consecutive paragraphs sent in each model request.
  paragraphs_per_request: 1
  # Concurrent API requests. Reduce this if the provider returns rate-limit errors.
  workers: 4

generation:
  max_output_tokens: 1024
  reasoning_effort: "low"
